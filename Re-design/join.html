<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOIN | SMTOWN &amp;STORE</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="inner-page" data-page="join">
  <header class="site-header">
    <div class="notice-strip"><div class="notice-inner"><a href="index.html">SMTOWN &amp;STORE</a><a href="login.html">이미 회원이라면 로그인</a></div></div>
    <div class="header-main wrap">
      <a class="brand" href="index.html"><img src="images/logo-symbol.png" alt="SMTOWN &STORE"></a>
      <nav class="primary-nav"><a href="celeb.html">CELEB</a><a href="product.html">PRODUCT</a><a href="pick.html">&amp;P!CK</a><a href="event.html">EVENT</a></nav>
      <div class="utility-actions"><a class="text-link" href="login.html">LOGIN</a><a class="text-link" href="join.html">JOIN</a><a class="bag-button" href="cart.html"><span>0</span></a></div>
    </div>
  </header>
  <main>
    <section class="page-section join-showcase">
      <div class="wrap join-layout">
        <div class="join-card">
          <p class="eyebrow">JOIN FLOW</p>
          <h1>회원가입</h1>
          <div class="step-list">
            <article><strong>01</strong><span>약관 동의</span><p>필수 약관과 마케팅 수신 동의를 분리합니다.</p></article>
            <article><strong>02</strong><span>기본 정보</span><p>이메일, 비밀번호, 휴대폰 인증 영역입니다.</p></article>
            <article><strong>03</strong><span>관심 아티스트</span><p>선호 그룹 선택으로 큐레이션을 연결합니다.</p></article>
          </div>
        </div>
        <div class="preference-card">
          <strong>Favorite artists</strong>
          <div class="artist-choice-grid"><span>aespa</span><span>RIIZE</span><span>Hearts2Hearts</span><span>NCT</span><span>SHINee</span><span>EXO</span><span>Red Velvet</span><span>Girls' Generation</span><span>Super Junior</span><span>TVXQ!</span><span>BoA</span><span>TAEYEON</span></div>
          <div class="consent-list">
            <label><input type="checkbox"> 만 14세 이상입니다.</label>
            <label><input type="checkbox"> 이용약관과 개인정보 처리방침에 동의합니다.</label>
            <label><input type="checkbox"> 관심 상품 알림을 받습니다.</label>
          </div>
          <button class="button button-primary" type="button" data-join-submit>가입 화면 확인</button>
        </div>
      </div>
    </section>
  </main>
  <script src="script/store.js"></script>
  <script src="script/common.js"></script>
  <script src="script/action.js"></script>
</body>
</html>
